services:
  postgres:
    image: postgres:16-alpine
    container_name: ad-generator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ad-generator-redis
    restart: unless-stopped
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      [
        "sh",
        "-c",
        "cat <<EOF > /data/users.acl\nuser default off\nuser ${REDIS_USERNAME} on >${REDIS_PASSWORD} ~* +@all\nEOF\nredis-server --appendonly yes --aclfile /data/users.acl",
      ]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --user $${REDIS_USERNAME} -a $${REDIS_PASSWORD} ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ad-generator-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GENAI_API: ${GENAI_API}
      LITELLM_API_KEY: ${LITELLM_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f -H \"Authorization: Bearer $${LITELLM_API_KEY}\" http://localhost:4000/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data: